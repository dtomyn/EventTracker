<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-factory</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --pass: #1f8f55; --pass-bg: #e3f5ea; --changes: #b26a00; --changes-bg: #fdf0d9;
    --pending: #8a92a3; --alert: #c62f3b; --alert-bg: #fde8ea; --accent: #3a5bd9;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #959cab; --line: #2b313c;
      --pass: #4cc38a; --pass-bg: #173326; --changes: #f0a83a; --changes-bg: #3a2a12;
      --pending: #7a8292; --alert: #ff6b76; --alert-bg: #3d1a1f; --accent: #7b96ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12px; }

  header { display: flex; align-items: baseline; gap: 12px; padding: 20px 24px 8px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  #status { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); }
  #status.offline .dot { background: var(--alert); }

  main { padding: 8px 24px 24px; overflow-x: auto; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(170px, 1fr)); gap: 12px; min-width: 1080px; }
  .col { background: transparent; border-radius: 10px; min-height: 60vh; }
  .col h2 { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 8px; padding: 0 4px;
            font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .col h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .col .stack { display: flex; flex-direction: column; gap: 8px; padding: 8px; border-radius: 10px;
                background: color-mix(in srgb, var(--line) 35%, transparent); min-height: calc(60vh - 28px); }
  .col.needs-human .stack { background: color-mix(in srgb, var(--alert-bg) 70%, transparent); }

  .card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
          background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: var(--shadow); }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .id { color: var(--muted); }
  .card .title { font-weight: 600; margin: 2px 0 6px; }
  .card.needs-human { border-color: var(--alert); box-shadow: 0 0 0 3px var(--alert-bg); }
  .card.merged { opacity: .7; }
  .card .note { color: var(--alert); font-size: 12px; margin-top: 6px; }

  .round { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
  .round .r { width: 22px; color: var(--muted); font-size: 11px; }
  .chip { flex: 1; text-align: center; font-size: 11px; line-height: 18px; border-radius: 9px;
          border: 1px dashed var(--pending); color: var(--pending); }
  .chip.PASS { border: 1px solid transparent; background: var(--pass-bg); color: var(--pass); }
  .chip.CHANGES { border: 1px solid transparent; background: var(--changes-bg); color: var(--changes); }
  .card.live .chip.pending { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .empty code { background: var(--panel); border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; }

  #backdrop { position: fixed; inset: 0; background: rgba(10, 14, 20, .35); }
  #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--panel);
            border-left: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(0, 0, 0, .12); }
  [hidden] { display: none !important; }
  #drawer .head { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
  #drawer .head .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #drawer h3 { margin: 0; font-size: 16px; }
  #drawer .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #close { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  #close:hover { background: var(--bg); color: var(--text); }
  .callout { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--alert-bg); color: var(--alert); font-size: 13px; }
  .callout .cmds { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
  .callout code { color: var(--text); white-space: nowrap; }
  #files { display: flex; flex-wrap: wrap; gap: 6px 4px; padding: 10px 20px; border-bottom: 1px solid var(--line); }
  #files .group { color: var(--muted); font-size: 11px; margin: 0 2px 0 8px; align-self: center; }
  #files .group:first-child { margin-left: 0; }
  #files button { font: inherit; font-size: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
                  border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  #files button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #files button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #files .v { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-left: 6px; vertical-align: 1px; }
  #files .v.PASS, #files .v.APPROVE { background: var(--pass); }
  #files .v.CHANGES { background: var(--changes); }
  #files .v.ESCALATE { background: var(--alert); }

  #doc { padding: 16px 24px 40px; overflow-y: auto; flex: 1; }
  #doc h1, #doc h2, #doc h3, #doc h4 { line-height: 1.3; margin: 1.2em 0 .4em; }
  #doc h1 { font-size: 20px; } #doc h2 { font-size: 16px; } #doc h3 { font-size: 14px; }
  #doc > :first-child { margin-top: 0; }
  #doc p, #doc ul, #doc ol { margin: .5em 0; }
  #doc ul, #doc ol { padding-left: 22px; }
  #doc code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  #doc pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
  #doc pre code { background: none; padding: 0; }
  #doc table { border-collapse: collapse; margin: .6em 0; font-size: 13px; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  #doc blockquote { margin: .5em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
  #doc a { color: var(--accent); }
  #doc .verdict { display: inline-block; font-weight: 700; font-size: 12px; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; margin-bottom: 4px; }
  #doc .verdict.PASS, #doc .verdict.APPROVE { background: var(--pass-bg); color: var(--pass); }
  #doc .verdict.CHANGES { background: var(--changes-bg); color: var(--changes); }
  #doc .verdict.ESCALATE { background: var(--alert-bg); color: var(--alert); }
  @media (max-width: 960px) {
    .board { grid-template-columns: 1fr; min-width: 0; }
    .col, .col .stack { min-height: 0; }
    .col .stack:empty { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>my-factory</h1>
  <span id="status"><span class="dot"></span><span id="status-text">connecting…</span></span>
</header>
<main><div id="board" class="board"></div></main>

<div id="backdrop" hidden></div>
<aside id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="d-title">
  <div class="head">
    <div class="row">
      <div><h3 id="d-title"></h3><div class="meta mono" id="d-meta"></div></div>
      <button id="close" aria-label="Close">×</button>
    </div>
    <div id="d-callout"></div>
  </div>
  <nav id="files" aria-label="Job files"></nav>
  <article id="doc"></article>
</aside>

<script>
const STAGES = [
  { key: "spec", label: "Spec", sub: "opus" },
  { key: "build", label: "Build", sub: "opus" },
  { key: "review", label: "Review", sub: "4 in parallel" },
  { key: "approve", label: "Approve", sub: "opus" },
  { key: "needs-human", label: "Needs human", sub: "" },
  { key: "merged", label: "Merged", sub: "main" },
];
const REVIEWERS = ["security", "ux", "ui", "code"];
const POLL_MS = 2000;

let boardText = "";
let board = { jobs: [] };
let lastOk = 0;
let openJob = null;
let openFile = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// ---------- board ----------

async function poll() {
  try {
    const res = await fetch("board.json", { cache: "no-store" });
    const text = res.status === 404 ? '{"jobs":[]}' : await res.text();
    if (!res.ok && res.status !== 404) throw new Error(res.status);
    lastOk = Date.now();
    if (text !== boardText) {
      board = JSON.parse(text);
      boardText = text;
      renderBoard();
      if (openJob) refreshDrawer();
    }
  } catch {
    // Keep the last good board; the status line shows we are offline.
  }
  renderStatus();
}

function renderStatus() {
  const age = lastOk ? Math.round((Date.now() - lastOk) / 1000) : null;
  const offline = age === null || age > POLL_MS / 1000 * 3;
  $("status").className = offline ? "offline" : "";
  const updated = board.updated ? ` · board updated ${timeAgo(board.updated)}` : "";
  $("status-text").textContent = offline ? "offline - is the server running?" : `live${updated}`;
}

function timeAgo(iso) {
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  if (Number.isNaN(s)) return "";
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  return `${Math.round(s / 3600)}h ago`;
}

function renderBoard() {
  const jobs = board.jobs || [];
  if (!jobs.length) {
    $("board").innerHTML = `<div class="empty" style="grid-column: 1 / -1">No jobs yet. Run <code>/my-factory &lt;feature&gt;</code> or <code>/my-factory next</code> in Claude Code.</div>`;
    return;
  }
  const known = new Set(STAGES.map((s) => s.key));
  $("board").innerHTML = STAGES.map((stage) => {
    const here = jobs.filter((j) => (known.has(j.stage) ? j.stage : "spec") === stage.key)
                     .sort((a, b) => String(b.updated).localeCompare(String(a.updated)));
    return `<section class="col ${stage.key}">
      <h2><span>${stage.label} <span class="sub">${here.length || ""}</span></span><span class="sub">${stage.sub}</span></h2>
      <div class="stack">${here.map(card).join("")}</div>
    </section>`;
  }).join("");
}

function rounds(job) {
  const all = [...(job.history || [])];
  if (job.round > 0 && job.reviews) all.push(job.reviews);
  return all;
}

function chipRow(reviews, n) {
  return `<div class="round"><span class="r mono">R${n}</span>${REVIEWERS.map((r) => {
    const v = ["PASS", "CHANGES"].includes(reviews?.[r]) ? reviews[r] : "pending";
    return `<span class="chip ${v}" title="${r}: ${v}">${r}</span>`;
  }).join("")}</div>`;
}

function card(job) {
  const rs = rounds(job);
  const live = job.stage === "review" ? "live" : "";
  return `<button class="card ${esc(job.stage)} ${live}" data-id="${esc(job.id)}">
    <div class="id mono">${esc(job.id)}</div>
    <div class="title">${esc(job.title || job.id)}</div>
    ${rs.map((r, i) => chipRow(r, i + 1)).join("")}
    ${job.stage === "needs-human" && job.note ? `<div class="note">${esc(job.note)}</div>` : ""}
  </button>`;
}

$("board").addEventListener("click", (e) => {
  const el = e.target.closest(".card");
  if (el) openDrawer(el.dataset.id);
});

// ---------- drawer ----------

// Only list files the board says exist, so the drawer never probes for missing ones.
function candidateFiles(job) {
  const specDone = job.stage !== "spec";
  const buildDone = specDone && !(job.stage === "build" && job.round <= 1);
  const files = [{ group: "", label: "feature", path: "feature.md" }];
  if (specDone) files.push({ group: "", label: "spec", path: "spec.md" });
  if (buildDone) files.push({ group: "", label: "build", path: "build.md" });
  rounds(job).forEach((reviews, i) => {
    REVIEWERS.filter((r) => ["PASS", "CHANGES"].includes(reviews?.[r])).forEach((r) => files.push({
      group: `round ${i + 1}`, label: r, path: `round-${i + 1}/review-${r}.md`, verdict: reviews[r],
    }));
  });
  for (let n = 1; n <= (job.reworks || 0); n++) files.push({ group: "human", label: `rework ${n}`, path: `rework-${n}.md` });
  const decision = String(job.decision || "").split(" ")[0];
  if (["APPROVE", "ESCALATE"].includes(decision)) files.push({ group: "", label: "decision", path: "decision.md", verdict: decision });
  return files;
}

async function fetchDoc(job, path) {
  try {
    const res = await fetch(`jobs/${encodeURIComponent(job.id)}/${path}`, { cache: "no-store" });
    return res.ok ? await res.text() : null;
  } catch { return null; }
}

function openDrawer(id) {
  openJob = id;
  openFile = null;
  $("backdrop").hidden = false;
  $("drawer").hidden = false;
  refreshDrawer();
  $("close").focus();
}

function closeDrawer() {
  const id = openJob;
  openJob = null;
  $("backdrop").hidden = true;
  $("drawer").hidden = true;
  document.querySelector(`.card[data-id="${CSS.escape(id || "")}"]`)?.focus();
}

async function refreshDrawer() {
  const job = (board.jobs || []).find((j) => j.id === openJob);
  if (!job) return closeDrawer();
  $("d-title").textContent = job.title || job.id;
  $("d-meta").textContent = `${job.id} · ${job.branch || ""} · ${job.stage}${job.round ? ` · round ${job.round}` : ""}`;
  $("d-callout").innerHTML = job.stage === "needs-human"
    ? `<div class="callout"><strong>Needs human.</strong> ${esc(job.note || "")}
       <div class="cmds"><code>/my-factory approve ${esc(job.id)}</code><code>/my-factory rework ${esc(job.id)} &lt;note&gt;</code></div></div>`
    : "";

  const files = candidateFiles(job);
  const docs = await Promise.all(files.map((f) => fetchDoc(job, f.path)));
  if (openJob !== job.id) return;
  const present = files.map((f, i) => ({ ...f, text: docs[i] })).filter((f) => f.text !== null);
  if (!present.some((f) => f.path === openFile)) openFile = present.length ? present[present.length - 1].path : null;

  $("files").innerHTML = present.map((f, i) => {
    const group = f.group && f.group !== present[i - 1]?.group ? `<span class="group">${esc(f.group)}</span>` : "";
    const dot = f.verdict && f.verdict !== "pending" ? `<span class="v ${esc(f.verdict)}"></span>` : "";
    return `${group}<button data-path="${esc(f.path)}" class="${f.path === openFile ? "on" : ""}">${esc(f.label)}${dot}</button>`;
  }).join("") || `<span class="group">No files yet</span>`;

  const current = present.find((f) => f.path === openFile);
  $("doc").innerHTML = current ? markdown(current.text) : "";
}

$("files").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-path]");
  if (!b) return;
  openFile = b.dataset.path;
  refreshDrawer();
});
$("close").addEventListener("click", closeDrawer);
$("backdrop").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openJob) closeDrawer(); });

// ---------- markdown (small, escape-first) ----------

function inline(raw) {
  const codes = [];
  let s = esc(raw).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
       .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, url) =>
         /^(https?:\/\/|#|\.{0,2}\/)/.test(url) || !url.includes(":")
           ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${text}</a>` : text);
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}

function markdown(src) {
  const lines = src.replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let para = [];
  const flush = () => { if (para.length) out.push(`<p>${inline(para.join(" "))}</p>`); para = []; };

  const first = lines.findIndex((l) => l.trim());
  const m = first >= 0 && lines[first].trim().match(/^(?:VERDICT:\s*)?(PASS|CHANGES|APPROVE|ESCALATE)\b/);
  if (m) { out.push(`<div class="verdict ${m[1]}">${esc(lines[first].trim())}</div>`); lines.splice(first, 1); }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flush();
      const body = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) body.push(lines[i]);
      out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`);
    } else if (/^#{1,6}\s/.test(line)) {
      flush();
      const level = Math.min(line.match(/^#+/)[0].length, 4);
      out.push(`<h${level}>${inline(line.replace(/^#+\s*/, ""))}</h${level}>`);
    } else if (/^\s*\|/.test(line) && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
      flush();
      const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
      const head = cells(line);
      i++;
      const rows = [];
      while (i + 1 < lines.length && /^\s*\|/.test(lines[i + 1])) rows.push(cells(lines[++i]));
      out.push(`<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${
        rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
    } else if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      flush();
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      for (; i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]); i++) {
        let text = lines[i].replace(/^\s*([-*]|\d+\.)\s+/, "");
        const box = text.match(/^\[( |x|X)\]\s*/);
        if (box) text = text.slice(box[0].length);
        items.push(`<li>${box ? (box[1] === " " ? "☐ " : "☑ ") : ""}${inline(text)}</li>`);
      }
      i--;
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
    } else if (/^>\s?/.test(line)) {
      flush();
      out.push(`<blockquote>${inline(line.replace(/^>\s?/, ""))}</blockquote>`);
    } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
      flush();
      out.push("<hr>");
    } else if (!line.trim()) {
      flush();
    } else {
      para.push(line.trim());
    }
  }
  flush();
  return out.join("\n");
}

poll();
setInterval(poll, POLL_MS);
setInterval(renderStatus, 1000);
</script>
</body>
</html>
